name: Daten einlesen (nur mit Freigabe)
on:
  workflow_dispatch:
    inputs:
      modus:
        type: choice
        description: Einlesemodus
        options: [aktualisieren, voll]
        default: aktualisieren
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: coaches-deploy
  cancel-in-progress: false
jobs:
  import:
    if: vars.ENABLE_LIVE_IMPORT == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/einlesen.py --modus "${{ inputs.modus }}" --ausgabe docs/daten/daten.json
      - name: Datensatz prüfen
        run: python scripts/validate_data.py docs/daten/daten.json
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/daten/daten.json
          if ! git diff --cached --quiet; then git commit -m 'Update basketball data'; git push; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
