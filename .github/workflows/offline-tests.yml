name: Offline-Import Tests (kein Live-Abruf)
on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'docs/daten/daten.json'
      - '.github/workflows/offline-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_data.py docs/daten/daten.json
      - run: python scripts/create_test_data.py --output /tmp/coaches-offline-testdaten.json
      - run: python scripts/validate_data.py /tmp/coaches-offline-testdaten.json --allow-synthetic
